name: Cucumber scenarios

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cucumber:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run all Cucumber scenarios
        run: mvn --batch-mode --no-transfer-progress test

      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-test-artifacts
          path: |
            target/surefire-reports/
            target/screenshots/
          if-no-files-found: ignore
          retention-days: 7
